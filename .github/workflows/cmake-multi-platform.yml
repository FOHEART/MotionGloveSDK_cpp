# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
    
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v6

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/out/build/ci" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # 构建树固定到 out/build/ci（与本地 out/build 同一约定）。`CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

  # ── 可选 VTK 3D 可视化示例：编译 + 启动测试 ────────────────────────────────
  # 该示例依赖 VTK 9.x，单独成一个 job，不影响上面的主构建矩阵：
  #   * Windows：用 tools/setup_vtk.bat 自动安装 conda-forge 预编译 VTK，编译 + 启动自检；
  #   * Linux：用 apt 的 libvtk9-dev，并在 Xvfb + Mesa 软件渲染下真正开窗运行。
  vtk-example:
    name: VTK example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          VTK_CONDA_CHANNEL: https://conda.anaconda.org/conda-forge
        run: |
          call tools\setup_vtk.bat
          if errorlevel 1 exit /b 1
          rem 不指定 -G：windows-latest 镜像在 VS2022/VS2026 之间变动，交给 CMake 自动选择
          cmake -S . -B out/build/ci-vtk -A x64 -DCMAKE_CONFIGURATION_TYPES=Release -DBUILD_TESTS=OFF -DBUILD_VTK_EXAMPLE=ON "-DVTK_DIR=%VTK_DIR%" "-DCMAKE_PREFIX_PATH=%VTK_CMAKE_PREFIX%"
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-vtk --config Release --target motionGloveSDK_example_vtk
          if errorlevel 1 exit /b 1

      - name: Install VTK and build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvtk9-dev xvfb libgl1-mesa-dri
          cmake -S . -B out/build/ci-vtk -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_VTK_EXAMPLE=ON
          cmake --build out/build/ci-vtk --target motionGloveSDK_example_vtk --parallel "$(nproc)"

      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 托管 runner 没有 GPU、系统只有 OpenGL 1.1；装 Mesa 的 llvmpipe（opengl32.dll）
        # 到输出目录，VTK 才能建出 OpenGL 3.2+ 上下文并真正开窗。失败不阻断后续步骤。
        continue-on-error: true
        env:
          MESA_VERSION: 26.2.5
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          curl.exe -fsSL -o $archive $url
          $out = Join-Path $env:RUNNER_TEMP 'mesa'
          & 7z x -y "-o$out" $archive 'x64/*' | Out-Null
          Copy-Item (Join-Path $out 'x64\*.dll') 'out/build/ci-vtk/Release' -Force
          Write-Host "已安装 Mesa $env:MESA_VERSION 软件 OpenGL"

      - name: Launch test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        # self-test 校验初始化路径；随后真实启动并等待窗口出现。
        # 若 Mesa 装不上（环境无 OpenGL 3.2+，示例以退出码 2 退出），降级为警告。
        run: ./tools/test_vtk_example_launch.ps1 -Exe out/build/ci-vtk/Release/motionGloveSDK_example_vtk.exe -AllowNoWindow

      - name: Launch test (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          exe=out/build/ci-vtk/motionGloveSDK_example_vtk
          chmod +x "$exe"

          echo "--- self-test：初始化 + 关闭端口（最多 60s）---"
          set +e
          stdbuf -o0 -e0 timeout 60s "$exe" --self-test 2>&1 | tee /tmp/vtk-selftest.log
          st_rc=${PIPESTATUS[0]}
          set -e
          if [ "$st_rc" -ne 0 ]; then
            echo "::error::self-test 失败或超时（退出码 $st_rc）"
            exit 1
          fi

          echo "--- 打开窗口运行 15s（timeout 返回 124 表示进程仍在运行）---"
          set +e
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render" stdbuf -o0 -e0 timeout 15s "$exe" > /tmp/vtk-launch.log 2>&1
          rc=$?
          set -e
          cat /tmp/vtk-launch.log

          if grep -q 'ERROR:' /tmp/vtk-launch.log; then
            echo "::error::VTK 运行时报错，见上面的日志"
            exit 1
          fi
          if [ "$rc" -ne 124 ]; then
            echo "::error::窗口未持续运行（退出码 $rc），启动失败"
            exit 1
          fi
          echo "VTK 示例已在 Xvfb 中正常启动并持续运行。"

  # ── scripts/ 一键脚本双系统自动测试 ──────────────────────────────────────────
  # scripts/ 下都是 cmd + POSIX sh 双解释器脚本（CRLF 检出也能跑）。这里真执行它们：
  #   * Linux  ：sh 分支端到端（build → test → package）+ 缺配置错误分支 + 产物断言；
  #     额外断言"传了 Release 就不许出现 x64-Debug 构建树"，防止首行 exec 的参数被
  #     CRLF 的 CR 污染后静默回落到默认值；
  #   * Windows：cmd 分支错误路径 + Git Bash 下的 sh 分支（验证 CRLF 兼容）+ 打包。
  # 与上面的裸 cmake 矩阵互补：那个验证工程本身，这个验证"一键脚本"在两端都可用。
  scripts-dual:
    name: scripts dual-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # ---- Linux：sh 分支端到端 -------------------------------------------------
      - name: Build via scripts (Linux, sh branch)
        if: runner.os == 'Linux'
        run: sh scripts/build.bat Release

      - name: Arg parsing sanity - Release only (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f out/install/x64-Release/lib/libMotionGloveSDK.so \
            || { echo "::error::Release 安装产物缺失"; exit 1; }
          if [ -d out/build/x64-Debug ]; then
            echo "::error::只传了 Release 却出现 x64-Debug 构建树——参数解析被 CR 污染，回落到了默认值"
            exit 1
          fi
          echo "[OK] 参数解析正常：只构建了 Release"

      - name: Unit tests via scripts (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/test.bat Release

      - name: Package via scripts (Linux, pwsh)
        if: runner.os == 'Linux'
        run: |
          sh scripts/package.bat
          ls -l out/pack/*.zip

      - name: Error branch - deploy with unknown config (Linux)
        if: runner.os == 'Linux'
        run: |
          if sh scripts/deploy.bat NoSuchConfig; then
            echo "::error::deploy.bat 对不存在的配置应返回非 0"
            exit 1
          fi
          echo "[OK] deploy 错误分支返回非 0"

      - name: Artifacts exist (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f out/install/x64-Release/lib/libMotionGloveSDK.so
          test -f out/install/x64-Release/include/motionGloveSDK.h
          test -f out/install_example/x64-Release/motionGloveSDK_example1
          echo "[OK] out/install 与 out/install_example 产物齐全"

      # ---- Windows：cmd 分支 + Git Bash 下的 sh 分支 -----------------------------
      - name: Error branch via cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          rem deploy.bat must exit 1 for a nonexistent build tree; note that
          rem a successful echo does NOT reset ERRORLEVEL, so reset it with verify
          cmd /c scripts\deploy.bat NoSuchConfig
          if not errorlevel 1 (
              echo ::error::deploy.bat should exit 1 for missing build tree
              exit /b 1
          )
          verify >nul
          echo [OK] deploy error branch returned 1

      - name: sh branch under Git Bash, CRLF workspace (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if bash scripts/deploy.bat NoSuchConfig; then
            echo "::error::Git Bash 下 deploy.bat 错误分支应返回非 0"
            exit 1
          fi
          echo "[OK] Git Bash（CRLF 检出）下 sh 分支可用且退出码正确"

      - name: Error branch - open_in_vscode without code (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          where code >nul 2>nul
          if errorlevel 1 (
              cmd /c scripts\open_in_vscode.bat
              if not errorlevel 1 exit /b 1
              verify >nul
              echo [OK] open_in_vscode missing-code branch returned 1
          ) else (
              echo [SKIP] runner has code, skip missing-dependency branch
          )

      - name: Package via scripts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmd /c scripts\package.bat
          if errorlevel 1 exit /b 1
          dir /b out\pack\*.zip
          echo [OK] package created

